# Render Blueprint — Node.js backend.
# The React frontend deploys via Vercel or static hosting.
#
# In the Render dashboard:
#   1. New -> Blueprint -> connect this repo
#   2. Set AI_SERVICE_SECRET, MONGODB_URI, etc. in the service's environment
#   3. Deploy.

services:
  - type: web
    name: swasthya-sathi-api
    runtime: node
    plan: free
    rootDir: backend
    healthCheckPath: /health
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_SECRET
        sync: false
      - key: AI_SERVICE_URL
        value: http://127.0.0.1:8100
