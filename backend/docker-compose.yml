services:
  mongodb:
    image: mongo:7
    container_name: swasthya-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }" | grep -E "(1|ok: 1)" ||
        mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]})" >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

  backend:
    build: .
    container_name: swasthya-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: "8000"
      BACKEND_PORT: "8000"
      TRUST_PROXY: "true"
      MONGODB_URI: mongodb://mongodb:27017/swasthya_sathi
      AUTH_PROVIDER: ${AUTH_PROVIDER:-mock}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:80}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://localhost:8000}
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:-dev-ai-internal-secret-9f2}

volumes:
  mongo-data:
